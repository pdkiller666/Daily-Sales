name: Build TWA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components & accept licenses
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          echo "=== SDK ready: $ANDROID_HOME ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null | head -3 || true

      - name: Setup Gradle
        uses: gradle/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/dailysales-release.p12"
          SIZE=$(wc -c < "${{ github.workspace }}/dailysales-release.p12")
          echo "Keystore size: ${SIZE} bytes"
          [ "$SIZE" -gt 100 ] || { echo "ERROR: KEYSTORE_BASE64 invalid (${SIZE} bytes)"; exit 1; }

      - name: Build APK
        run: |
          gradle :app:assembleRelease \
            --project-dir android \
            --no-daemon \
            --stacktrace 2>&1 | tail -80
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/dailysales-release.p12
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find android -name "*.apk" 2>/dev/null | grep release | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then APK=$(find android -name "*.apk" 2>/dev/null | head -1); fi
          echo "Found: $APK"
          [ -n "$APK" ] || { echo "No APK produced"; find android -type f 2>/dev/null | tail -20; exit 1; }
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          FINAL="DailySales-v1.0.${{ github.run_number }}.apk"
          cp "${{ steps.find_apk.outputs.apk_path }}" "$FINAL"
          echo "APK_FILE=$FINAL" >> $GITHUB_ENV
          echo "Size: $(wc -c < "$FINAL") bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailySales-APK-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "DailySales APK — сборка #${{ github.run_number }}"
          body: |
            ## Автоматическая TWA-сборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`

            ### Установка на Android (разовая настройка)
            1. Скачайте APK-файл ниже
            2. Откройте на телефоне → разрешите «Установку из неизвестных источников»
            3. Готово — иконка DailySales появится на рабочем столе

            ### Обновление
            Просто установите новый APK поверх старого — данные сохранятся.
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false

      - name: Notify server about new APK release
        if: ${{ secrets.APK_WEBHOOK_SECRET != '' }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          RELEASE_URL="${{ steps.create_release.outputs.url }}"
          RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          APK_URL="https://github.com/pdkiller666/Daily-Sales/releases/download/apk-${{ github.run_number }}/DailySales-v1.0.${{ github.run_number }}.apk"
          PAYLOAD="{\"version\":\"${VERSION}\",\"release_url\":\"${RELEASE_URL}\",\"apk_url\":\"${APK_URL}\",\"release_date\":\"${RELEASE_DATE}\"}"
          STATUS=$(curl -s -o /tmp/webhook_resp.txt -w "%{http_code}" \
            -X POST "https://dailysales.app/webhook/apk-release" \
            -H "Authorization: Bearer ${{ secrets.APK_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" --max-time 15 || echo "000")
          echo "Webhook HTTP status: ${STATUS}"
          cat /tmp/webhook_resp.txt || true
