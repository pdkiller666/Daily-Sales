name: Build TWA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Accept Android SDK licenses
        run: |
          SDK="$ANDROID_HOME"
          SDKMAN=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDK: $SDK  sdkmanager: $SDKMAN"
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses 2>/dev/null || true
          fi

      - name: Configure Bubblewrap
        run: |
          JAVA_DIR=$(dirname "$(dirname "$(readlink -f "$(which java)")")")
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p ~/.bubblewrap
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_DIR" "$SDK_DIR" > ~/.bubblewrap/config.json
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dailysales-release.p12
          echo "Keystore size: $(wc -c < dailysales-release.p12) bytes"

      - name: Generate Android project (bubblewrap init phase)
        run: |
          # bubblewrap build without signing flags: pipe passwords to stdin
          # Order: 1) store password 2) key password
          printf '%s\n%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            | bubblewrap build --skipPwaValidation 2>&1 | tee build.log || true
          echo "=== build.log tail ==="
          tail -30 build.log

      - name: Check if APK was produced
        id: check_apk
        run: |
          APK=$(find . -name "*.apk" 2>/dev/null | grep -v unsigned | head -1)
          UNSIGNED=$(find . -name "*unsigned*.apk" -o -name "*release*.apk" 2>/dev/null | head -1)
          echo "Signed APK: $APK"
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "$APK" ] && [ "$APK" != "$UNSIGNED" ]; then
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "needs_sign=false" >> $GITHUB_OUTPUT
          elif [ -n "$UNSIGNED" ]; then
            echo "apk_path=$UNSIGNED" >> $GITHUB_OUTPUT
            echo "needs_sign=true" >> $GITHUB_OUTPUT
          else
            # Try to build unsigned APK via Gradle directly
            echo "needs_sign=true" >> $GITHUB_OUTPUT
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Build unsigned APK via Gradle (fallback)
        if: steps.check_apk.outputs.apk_path == ''
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon 2>&1 | tail -50
          else
            echo "ERROR: android/ directory not found after bubblewrap"
            ls -la
            exit 1
          fi

      - name: Find APK after Gradle
        if: steps.check_apk.outputs.apk_path == ''
        id: find_apk2
        run: |
          APK=$(find android -name "*.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Sign APK with apksigner
        id: sign
        run: |
          APK="${{ steps.check_apk.outputs.apk_path }}"
          if [ -z "$APK" ]; then
            APK="${{ steps.find_apk2.outputs.apk_path }}"
          fi
          NEEDS_SIGN="${{ steps.check_apk.outputs.needs_sign }}"
          echo "APK to process: $APK  needs_sign: $NEEDS_SIGN"

          FINAL="DailySales-v1.0.${{ github.run_number }}.apk"

          if [ "$NEEDS_SIGN" = "true" ] && [ -n "$APK" ]; then
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            APKSIGNER=$(find "$SDK" -name apksigner -type f 2>/dev/null | head -1)
            echo "apksigner: $APKSIGNER"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks dailysales-release.p12 \
                --ks-type PKCS12 \
                --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
                --ks-key-alias dailysales \
                --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
                --out "$FINAL" \
                "$APK"
              echo "Signed: $FINAL ($(wc -c < "$FINAL") bytes)"
            else
              echo "apksigner not found, using APK as-is"
              cp "$APK" "$FINAL"
            fi
          elif [ -n "$APK" ]; then
            cp "$APK" "$FINAL"
          else
            echo "ERROR: No APK found"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK_FILE=$FINAL" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailySales-APK-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "DailySales APK — сборка #${{ github.run_number }}"
          body: |
            ## Автоматическая TWA-сборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`

            ### Установка на Android (разовая настройка)
            1. Скачайте APK-файл ниже
            2. Откройте на телефоне → разрешите «Установку из неизвестных источников»
            3. Готово — иконка DailySales появится на рабочем столе

            ### Обновление
            Просто установите новый APK поверх старого — данные сохранятся.

            ### Push-уведомления
            Работают через Chrome (GMS). На Huawei с GBox — через Chrome, установленный в GBox.
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
