name: Build TWA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        run: |
          ANDROID_SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          yes | sdkmanager --sdk_root="$ANDROID_SDK" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>/dev/null || true

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dailysales-release.p12
          echo "Keystore size: $(wc -c < dailysales-release.p12) bytes"

      - name: Build TWA APK
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ./dailysales-release.p12 \
            --signingKeyAlias dailysales \
            --signingKeyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --signingKeyStorePassword "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Find built APK
        id: apk
        run: |
          APK=$(find . -name "*signed*.apk" -o -name "app-release*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK" 2>/dev/null || echo "APK not found yet"

      - name: Rename APK
        run: |
          SRC="${{ steps.apk.outputs.apk_path }}"
          DEST="DailySales-v1.0.${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "APK_FILE=$DEST" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailySales-APK-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "DailySales APK — сборка #${{ github.run_number }}"
          body: |
            ## Автоматическая TWA-сборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`

            ### Установка на Android (разовая настройка)
            1. Скачайте APK-файл ниже
            2. Откройте на телефоне → разрешите «Установку из неизвестных источников»
            3. Готово — иконка DailySales появится на рабочем столе

            ### Обновление
            Просто установите новый APK поверх старого — данные сохранятся.

            ### Push-уведомления
            Работают через Chrome (GMS). На Huawei с GBox — работают если Chrome установлен через GBox.
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
