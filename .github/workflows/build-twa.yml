name: Build TWA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix Android SDK cmdline-tools layout
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "=== cmdline-tools contents ==="
          ls "$SDK/cmdline-tools/" 2>/dev/null || echo "(empty)"

          # bubblewrap requires cmdline-tools/latest — create symlink if missing
          if [ -d "$SDK/cmdline-tools" ] && [ ! -d "$SDK/cmdline-tools/latest" ]; then
            SLOT=$(ls "$SDK/cmdline-tools" | head -1)
            echo "Creating symlink: cmdline-tools/$SLOT -> cmdline-tools/latest"
            ln -s "$SDK/cmdline-tools/$SLOT" "$SDK/cmdline-tools/latest"
          fi

          # Accept all licenses
          SDKMAN=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses 2>/dev/null || true
            "$SDKMAN" "build-tools;34.0.0" "platforms;android-34" 2>/dev/null || true
          fi

          echo "=== cmdline-tools after fix ==="
          ls "$SDK/cmdline-tools/" 2>/dev/null

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA_DIR=$(dirname "$(dirname "$(readlink -f "$(which java)")")")
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' \
            "$JAVA_DIR" "$SDK" > ~/.bubblewrap/config.json
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dailysales-release.p12
          echo "Keystore size: $(wc -c < dailysales-release.p12) bytes"

      - name: Build TWA APK
        run: |
          printf '%s\n%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            | bubblewrap build --skipPwaValidation 2>&1 | tee build.log
          echo "--- build.log tail ---"
          tail -40 build.log

      - name: Find built APK
        id: find_apk
        run: |
          # prefer signed (non-unsigned) APK
          APK=$(find . -name "*.apk" 2>/dev/null | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "Found: $APK"
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          FINAL="DailySales-v1.0.${{ github.run_number }}.apk"
          cp "${{ steps.find_apk.outputs.apk_path }}" "$FINAL"
          echo "APK_FILE=$FINAL" >> $GITHUB_ENV
          echo "Size: $(wc -c < "$FINAL") bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailySales-APK-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "DailySales APK — сборка #${{ github.run_number }}"
          body: |
            ## Автоматическая TWA-сборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`

            ### Установка на Android (разовая настройка)
            1. Скачайте APK-файл ниже
            2. Откройте на телефоне → разрешите «Установку из неизвестных источников»
            3. Готово — иконка DailySales появится на рабочем столе

            ### Обновление
            Просто установите новый APK поверх старого — данные сохранятся.

            ### Push-уведомления
            Работают через Chrome (GMS). На Huawei с GBox — через Chrome, установленный в GBox.
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false

      - name: Notify server about new APK release
        if: ${{ secrets.APK_WEBHOOK_SECRET != '' }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          RELEASE_URL="${{ steps.create_release.outputs.url }}"
          RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          APK_URL="https://github.com/pdkiller666/Daily-Sales/releases/download/apk-${{ github.run_number }}/DailySales-v1.0.${{ github.run_number }}.apk"
          PAYLOAD="{\"version\":\"${VERSION}\",\"release_url\":\"${RELEASE_URL}\",\"apk_url\":\"${APK_URL}\",\"release_date\":\"${RELEASE_DATE}\"}"
          echo "Notifying server: version=${VERSION}"
          STATUS=$(curl -s -o /tmp/webhook_resp.txt -w "%{http_code}" \
            -X POST "https://dailysales.app/webhook/apk-release" \
            -H "Authorization: Bearer ${{ secrets.APK_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            --max-time 15 || echo "000")
          echo "Webhook HTTP status: ${STATUS}"
          cat /tmp/webhook_resp.txt || true
          if [ "${STATUS}" != "200" ]; then
            echo "WARNING: Webhook returned non-200 status ${STATUS}. Continuing anyway."
          fi
