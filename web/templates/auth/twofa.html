<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Двухфакторная аутентификация — DailySales</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232563eb'/><text x='50' y='57' text-anchor='middle' font-size='44' font-family='Arial,sans-serif' font-weight='bold' fill='white'>DS</text></svg>">
    <link rel="stylesheet" href="/static/app.css?v=312a90bb98">
</head>
<body class="h-full min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
    <div class="relative w-full max-w-sm mx-4">
        <div class="bg-slate-900/80 backdrop-blur border border-slate-700/60 rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <div class="mx-auto w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center mb-3">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-white">Подтверждение входа</h1>
                <p class="text-sm text-slate-400 mt-1">Введите 6-значный код из приложения-аутентификатора</p>
            </div>

            {% if error %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-sm text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/auth/2fa" autocomplete="off">
                <input type="hidden" name="pending" value="{{ pending }}">
                <input type="hidden" name="login_nonce" value="{{ login_nonce }}">
                <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
                       maxlength="14" autofocus
                       class="w-full text-center tracking-[0.4em] text-2xl font-mono px-4 py-3 rounded-lg bg-slate-800 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="000000">
                <p class="text-xs text-slate-500 mt-2 text-center">Можно ввести код восстановления, если нет доступа к приложению.</p>
                <button type="submit"
                        class="mt-5 w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition">
                    Войти
                </button>
            </form>

            <div class="mt-5 text-center">
                <a href="/login" class="text-sm text-slate-400 hover:text-slate-200">← Назад ко входу</a>
            </div>
        </div>
    </div>
</body>
</html>
