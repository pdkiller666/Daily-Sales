<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нет соединения — DailySales</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
    color: #1e293b;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 18px 48px rgba(30, 41, 59, 0.12);
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 18px;
    margin: 0 auto 20px;
    object-fit: cover;
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.25);
  }
  .icon {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    display: block;
    color: #6366f1;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.55; color: #64748b; margin-bottom: 26px; }
  button {
    width: 100%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 12px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
  }
  button:active { transform: translateY(1px); }
  .hint { margin-top: 18px; font-size: 13px; color: #94a3b8; }
  .dot {
    display: inline-block; width: 9px; height: 9px;
    border-radius: 50%; background: #ef4444; margin-right: 6px;
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 100%); color: #e2e8f0; }
    .card { background: #1e293b; box-shadow: 0 18px 48px rgba(0,0,0,.45); }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/logo.jpg" alt="DailySales" class="logo" onerror="this.style.display='none'">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-12.728 0a9 9 0 010-12.728m9.9 2.829a5 5 0 010 7.07m-7.07 0a5 5 0 010-7.07M12 12h.01"/>
    </svg>
    <h1><span class="dot"></span>Нет подключения к интернету</h1>
    <p>Похоже, соединение пропало. Проверьте сеть и попробуйте снова — ваши данные в безопасности и появятся, как только связь восстановится.</p>
    <button onclick="location.reload()">Повторить попытку</button>
    <div class="hint">DailySales продолжит работу автоматически после восстановления сети.</div>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
