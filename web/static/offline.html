<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нет соединения — DailySales</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/offline.css">
</head>
<body>
  <div class="card">
    <img id="offline-logo" src="/static/logo.jpg" alt="DailySales" class="logo">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-12.728 0a9 9 0 010-12.728m9.9 2.829a5 5 0 010 7.07m-7.07 0a5 5 0 010-7.07M12 12h.01"/>
    </svg>
    <h1><span class="dot"></span>Нет подключения к интернету</h1>
    <p>Похоже, соединение пропало. Проверьте сеть и попробуйте снова — ваши данные в безопасности и появятся, как только связь восстановится.</p>
    <button id="offline-reload">Повторить попытку</button>
    <div class="hint">DailySales продолжит работу автоматически после восстановления сети.</div>
  </div>
  <script>
    (function() {
      var logo = document.getElementById('offline-logo');
      if (logo) logo.addEventListener('error', function() { this.style.display = 'none'; });
      var btn = document.getElementById('offline-reload');
      if (btn) btn.addEventListener('click', function() { location.reload(); });
      window.addEventListener('online', function() { location.reload(); });
    })();
  </script>
</body>
</html>
